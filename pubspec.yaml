name: flutter_startup_tracer
description: >-
  Measure Flutter app startup from process start to first frame and interactive,
  with an ASCII waterfall, DevTools timeline events and actionable advice.
version: 0.1.0
repository: https://github.com/youssef336/flutter_startup_tracer
issue_tracker: https://github.com/youssef336/flutter_startup_tracer/issues
topics:
  - performance
  - startup
  - profiling
  - devtools

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.youssef336.flutter_startup_tracer
        pluginClass: FlutterStartupTracerPlugin
      ios:
        pluginClass: FlutterStartupTracerPlugin
